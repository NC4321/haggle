[package]
name = "haggle"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "haggle"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
time = { version = "0.3.55", features = ["formatting", "macros"] }

[profile.release]
lto = "thin"
strip = true
